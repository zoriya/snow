apiVersion: apps/v1
kind: Deployment
metadata:
  name: matcher
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: matcher
  template:
    metadata:
      labels:
        app.kubernetes.io/component: matcher
    spec:
      containers:
      - name: matcher
        image: arthichaud/meelo-matcher:v3.12.0
        ports:
        - name: http
          containerPort: 6789
        env:
        - name: API_URL
          value: http://server:4000
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: api-key
              key: uuid
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq
              key: uuid
        - name: RABBITMQ_URL
          value: amqp://meelo:$(RABBITMQ_PASSWORD)@rabbitmq:5672
        - name: INTERNAL_CONFIG_DIR
          value: /config
        volumeMounts:
        - name: settings
          mountPath: /config
          readOnly: true
      volumes:
      - name: settings
        secret:
          secretName: settings
---
apiVersion: v1
kind: Service
metadata:
  name: matcher
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: matcher
  ports:
  - name: http
    port: 6789
    targetPort: http
