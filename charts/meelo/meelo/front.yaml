apiVersion: apps/v1
kind: Deployment
metadata:
  name: front
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: front
  template:
    metadata:
      labels:
        app.kubernetes.io/component: front
    spec:
      containers:
      - name: front
        image: arthichaud/meelo-front:v3.12.0
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: PUBLIC_SERVER_URL
          value: https://meelo.sdg.moe/api
        - name: SSR_SERVER_URL
          value: http://server:4000
        - name: PUBLIC_SCANNER_URL
          value: https://meelo.sdg.moe/scanner
        - name: SSR_SCANNER_URL
          value: http://scanner:8133
        - name: PUBLIC_MATCHER_URL
          value: https://meelo.sdg.moe/matcher
        - name: SSR_MATCHER_URL
          value: http://matcher:6789
---
apiVersion: v1
kind: Service
metadata:
  name: front
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: front
  ports:
  - name: http
    port: 3000
    targetPort: http
