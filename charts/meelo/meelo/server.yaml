apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: config
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 16Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
    spec:
      containers:
      - name: server
        image: arthichaud/meelo-server:v3.12.0
        ports:
        - name: http
          containerPort: 4000
        env:
        - name: DATABASE_URL
          value: postgresql://meelo@postgres-cluster-rw.postgres:5432/meelo?schema=public&sslmode=verify-full&sslcert=/pg/tls.crt&sslkey=/pg/tls.key&sslrootcert=/pg/ca.crt
        - name: MEILI_HOST
          value: http://meilisearch:7700
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: meilisearch
              key: uuid
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq
              key: uuid
        - name: RABBITMQ_URL
          value: amqp://meelo:$(RABBITMQ_PASSWORD)@rabbitmq:5672
        - name: TRANSCODER_URL
          value: http://transcoder:7666
        - name: JWT_SIGNATURE
          valueFrom:
            secretKeyRef:
              name: jwt
              key: uuid
        - name: API_KEYS
          valueFrom:
            secretKeyRef:
              name: api-key
              key: uuid
        - name: INTERNAL_CONFIG_DIR
          value: /config
        - name: INTERNAL_DATA_DIR
          value: /data
        - name: ALLOW_ANONYMOUS
          value: "0"
        - name: ENABLE_USER_REGISTRATION
          value: "1"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: settings
          mountPath: /config/settings.json
          subPath: settings.json
        - name: musics
          mountPath: /data
        - name: postgres-cert
          mountPath: /pg
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: config
      - name: settings
        configMap:
          name: settings
      - name: musics
        persistentVolumeClaim:
          claimName: musics
      - name: postgres-cert
        secret:
          secretName: postgres-meelo
          defaultMode: 0640
---
apiVersion: v1
kind: Service
metadata:
  name: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: server
  ports:
  - name: http
    port: 4000
    targetPort: http
